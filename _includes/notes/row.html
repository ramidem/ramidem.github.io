{%- assign post = include.post -%}
<li data-folder="{{ post.categories.first | escape }}"><a class="note-row" href="{{ post.url | relative_url }}"{% if post.url == include.current.url %} aria-current="true"{% endif %}><strong>{{ post.title }}</strong><span class="note-row-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-m/%-d/%y" }}</time>{{ post.description | default: post.excerpt | strip_html | strip_newlines | strip }}</span></a></li>
