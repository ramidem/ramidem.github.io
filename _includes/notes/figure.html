{%- comment -%}
  Image with an optional caption.
  {% include notes/figure.html src="/notes/media/photo.jpg" alt="..." caption="..." %}
{%- endcomment -%}
<figure class="note-figure">
<img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
{%- if include.caption %}
<figcaption>{{ include.caption }}</figcaption>
{%- endif %}
</figure>
