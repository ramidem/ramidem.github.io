url: "https://ramidem.github.io"
baseurl: ""
author: "Med Aduh"
tagline: "Software engineer building full-stack product systems and operational tools."
# GoatCounter site code for analytics (<code>.goatcounter.com); empty turns it off
goatcounter: "ramidem"
# Image for link previews (Open Graph / Twitter cards)
logo: /assets/icons/apple-icon-180x180.png

exclude: ["CNAME", "Gemfile", "Gemfile.lock", "LICENSE", "README.md"]

# Keep a locally built search index across rebuilds (see README: Notes > Search)
keep_files: ["pagefind"]

# Dependencies
markdown: kramdown
highlighter: rouge

# Permalinks
permalink: pretty

# Atom feed of the notes (jekyll-feed). The feed's title and subtitle come from
# title and description; nothing else on the site uses them.
plugins:
  - jekyll-feed
title: "Med Aduh"
description: "Notes by Med Aduh."
feed:
  path: notes/feed.xml

# Dates are shown in this timezone (GitHub builds in UTC otherwise)
timezone: Asia/Manila

# Notes are posts: /notes/<folder>/<filename-slug>/ (or /notes/<slug>/ without a folder),
# rendered in the notes app layout. Folder pages live in notes/<folder>/index.html.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: note
      permalink: /notes/:categories/:title/
      styles: /notes/styles.css
  - scope:
      path: "notes"
      type: pages
    values:
      styles: /notes/styles.css
